<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 16px Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 13px Arial, sans-serif; fill: #334155; }
      .box { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 16; }
      .box2 { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 16; }
      .box3 { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 16; }
      .box4 { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; rx: 16; }
      .box5 { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 16; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .db { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .cache { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .msg { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 14; }
      .gateway { fill: #F5F3FF; stroke: #7C3AED; stroke-width: 2; rx: 16; }
      .user { fill: #E2E8F0; stroke: #334155; stroke-width: 2; rx: 16; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text x="600" y="45" text-anchor="middle" class="title">Train Ticket Booking System Architecture</text>

  <!-- User -->
  <rect class="user" x="40" y="260" width="120" height="80" rx="16"/>
  <text x="100" y="305" text-anchor="middle" class="label">User</text>

  <!-- API Gateway -->
  <rect class="gateway" x="210" y="230" width="160" height="140" rx="18"/>
  <text x="290" y="280" text-anchor="middle" class="label">API Gateway</text>
  <text x="290" y="305" text-anchor="middle" class="small">Auth</text>
  <text x="290" y="322" text-anchor="middle" class="small">Rate Limit</text>
  <text x="290" y="339" text-anchor="middle" class="small">Routing</text>

  <!-- Services -->
  <rect class="box" x="430" y="100" width="180" height="90" rx="16"/>
  <text x="520" y="145" text-anchor="middle" class="label">Search Service</text>
  <text x="520" y="168" text-anchor="middle" class="small">Train + fare lookup</text>

  <rect class="box2" x="430" y="240" width="180" height="90" rx="16"/>
  <text x="520" y="285" text-anchor="middle" class="label">Booking Service</text>
  <text x="520" y="308" text-anchor="middle" class="small">Seat reservation</text>

  <rect class="box3" x="430" y="380" width="180" height="90" rx="16"/>
  <text x="520" y="425" text-anchor="middle" class="label">Payment Service</text>
  <text x="520" y="448" text-anchor="middle" class="small">Authorization / refunds</text>

  <rect class="box4" x="700" y="250" width="180" height="90" rx="16"/>
  <text x="790" y="295" text-anchor="middle" class="label">Cancellation</text>
  <text x="790" y="318" text-anchor="middle" class="small">Release seats + refund</text>

  <rect class="box5" x="700" y="420" width="180" height="90" rx="16"/>
  <text x="790" y="465" text-anchor="middle" class="label">Notification</text>
  <text x="790" y="488" text-anchor="middle" class="small">Email / SMS / WhatsApp</text>

  <!-- Data stores -->
  <rect class="db" x="930" y="110" width="200" height="120" rx="16"/>
  <text x="1030" y="155" text-anchor="middle" class="label">Relational DB</text>
  <text x="1030" y="178" text-anchor="middle" class="small">Bookings</text>
  <text x="1030" y="195" text-anchor="middle" class="small">Payments</text>
  <text x="1030" y="212" text-anchor="middle" class="small">Inventory</text>

  <rect class="cache" x="930" y="270" width="200" height="100" rx="16"/>
  <text x="1030" y="315" text-anchor="middle" class="label">Redis Cache</text>
  <text x="1030" y="338" text-anchor="middle" class="small">Hot routes</text>
  <text x="1030" y="355" text-anchor="middle" class="small">Fare + availability</text>

  <rect class="msg" x="930" y="405" width="200" height="120" rx="16"/>
  <text x="1030" y="450" text-anchor="middle" class="label">Event Bus / Kafka</text>
  <text x="1030" y="473" text-anchor="middle" class="small">Notifications</text>
  <text x="1030" y="490" text-anchor="middle" class="small">Audit / analytics</text>

  <!-- Arrows -->
  <path class="arrow" d="M160 300 L210 300"/>
  <path class="arrow" d="M370 300 L430 300"/>
  <path class="arrow" d="M520 190 L520 240"/>
  <path class="arrow" d="M520 330 L520 380"/>
  <path class="arrow" d="M610 285 L700 285"/>
  <path class="arrow" d="M610 425 L700 425"/>
  <path class="arrow" d="M610 145 L930 170"/>
  <path class="arrow" d="M610 285 L930 315"/>
  <path class="arrow" d="M610 425 L930 465"/>

  <path class="arrow" d="M790 340 L790 420"/>
  <path class="arrow" d="M520 470 L520 540 L830 540 L830 510"/>

  <!-- Footer labels -->
  <text x="600" y="620" text-anchor="middle" class="small">Core idea: strong consistency for bookings + fast cache for search + async events for notifications and analytics</text>
</svg>
